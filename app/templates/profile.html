{% extends "base.html" %}

{% block title %}
Profile | StudentOS
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="mb-4">
        <h1 class="fw-bold">Profile</h1>
        <p class="text-muted">
            Manage your StudentOS account information.
        </p>
    </div>

    <div class="card">
        <div class="card-body">

            <div class="d-flex align-items-center mb-4">

                <i class="bi bi-person-circle fs-1 me-3"></i>

                <div>
                    <h4 class="mb-1">
                        {{ current_user.username }}
                    </h4>

                    <p class="text-muted mb-0">
                        {{ current_user.email }}
                    </p>
                </div>

            </div>

            <hr>

            <div class="row mt-4">

                <div class="col-md-6">
                    <p class="text-muted mb-1">Username</p>
                    <p class="fw-semibold">
                        {{ current_user.username }}
                    </p>
                </div>

                <div class="col-md-6">
                    <p class="text-muted mb-1">Email</p>
                    <p class="fw-semibold">
                        {{ current_user.email }}
                    </p>
                </div>

            </div>

        </div>
    </div>

</div>

{% endblock %}
