{% extends "base.html" %}

{% block title %}
Add Task | StudentOS
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">Add a New Study Task</h2>

    <form method="POST">

        <div class="mb-3">
            <label for="title" class="form-label">
                Task Title
            </label>

            <input type="text" class="form-control" id="title" name="title" placeholder="Enter your study task"
                required>
        </div>

        <button type="submit" class="btn btn-primary">
            Add Task
        </button>

    </form>

</div>

{% endblock %}
